<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Scientific Architect - Coder at Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050510;
            --nld-pink: #ff2d95;
            --bio-green: #00ffa3;
            --ml-cyan: #00d9ff;
            --glass: rgba(10, 10, 25, 0.7);
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .workspace-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .data-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(-20%);
            z-index: 0;
            opacity: 0.5;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out;
            position: absolute;
        }

        @keyframes rotateDNA {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .dna-strand {
            animation: rotateDNA 8s linear infinite;
            transform-style: preserve-3d;
        }

        .lorenz-path {
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawPath 10s linear infinite;
        }

        @keyframes drawPath {
            to { stroke-dashoffset: 0; }
        }

        .monitor-glow {
            position: absolute;
            width: 400px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.15) 0%, transparent 70%);
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="data-grid"></div>

    <div class="workspace-container" id="scene">
        
        <div class="absolute top-[20%] left-1/2 -translate-x-1/2 z-10">
            <div class="w-[500px] h-[300px] bg-black border-4 border-[#1a1a2e] rounded-xl relative overflow-hidden shadow-[0_0_40px_rgba(0,217,255,0.2)]">
                <div class="p-4 font-mono text-[11px] leading-tight">
                    <div class="flex items-center gap-2 mb-3 border-b border-white/10 pb-1">
                        <div class="w-2 h-2 rounded-full bg-red-500"></div>
                        <span class="text-gray-500">biophys_sim.py</span>
                    </div>
                    <p class="text-pink-400">import <span class="text-white">jax.numpy</span> as <span class="text-white">jnp</span></p>
                    <p class="text-cyan-400"># Solving Nonlinear Dynamics for Protein Folding</p>
                    <p class="text-white">def <span class="text-blue-400">lorenz_system</span>(state, t):</p>
                    <p class="pl-4 text-gray-400">x, y, z = state</p>
                    <p class="pl-4 text-gray-400">dx = sigma * (y - x)</p>
                    <p class="pl-4 text-gray-400">dy = x * (rho - z) - y</p>
                    <p class="pl-4 text-gray-400">dz = x * y - beta * z</p>
                    <p class="pl-4 text-pink-400">return <span class="text-white">[dx, dy, dz]</span></p>
                    <p class="mt-4 text-emerald-400 animate-pulse">>> INTEGRATION STEP: 4529 | LOSS: 0.00034</p>
                    <div class="w-2 h-4 bg-cyan-500 animate-pulse mt-1"></div>
                </div>
                <div class="absolute inset-0 pointer-events-none opacity-10 bg-[linear-gradient(transparent_0%,rgba(0,217,255,0.1)_50%,transparent_100%)] bg-[length:100%_4px]"></div>
            </div>
            <div class="w-16 h-12 bg-[#1a1a2e] mx-auto"></div>
            <div class="w-48 h-3 bg-[#1a1a2e] mx-auto rounded-t-lg"></div>
        </div>

        <div class="absolute bottom-[-10%] left-1/2 -translate-x-1/2 z-40 scale-125" data-depth="0.05">
            <svg width="600" height="400" viewBox="0 0 600 400" fill="none">
                <!-- Chair Back -->
                <path d="M220 400C220 300 380 300 380 400" fill="#08081a" />
                
                <!-- The Human in Coding Position -->
                <g id="human-body">
                    <path d="M180 400L210 280C210 280 230 250 300 250C370 250 390 280 390 280L420 400H180Z" fill="#030308" />
                    <ellipse cx="300" cy="205" rx="35" ry="45" fill="#030308" />
                    <!-- Headphones -->
                    <path d="M260 210C260 160 340 160 340 210" stroke="var(--ml-cyan)" stroke-width="6" opacity="0.4" fill="none"/>
                    <rect x="255" y="195" width="12" height="35" rx="4" fill="var(--nld-pink)" />
                    <rect x="333" y="195" width="12" height="35" rx="4" fill="var(--bio-green)" />
                    
                    <!-- Rim Lighting reflections -->
                    <path d="M210 285L185 380" stroke="var(--nld-pink)" stroke-width="3" opacity="0.3" stroke-linecap="round" />
                    <path d="M390 285L415 380" stroke="var(--bio-green)" stroke-width="3" opacity="0.3" stroke-linecap="round" />
                </g>

                <!-- Keyboard setup -->
                <rect x="150" y="370" width="300" height="60" rx="8" fill="#0a0a1a" stroke="rgba(255,255,255,0.1)" />
                <rect x="170" y="385" width="260" height="5" rx="2" fill="rgba(0,217,255,0.2)" />
            </svg>
        </div>

        <div class="glass-panel w-56 h-64 left-10 top-[15%] z-50 transform -rotate-6" data-depth="0.15">
            <div class="p-3 border-b border-pink-500/20">
                <span class="text-[10px] font-bold text-pink-400 tracking-tighter uppercase">Nonlinear Systems</span>
            </div>
            <div class="h-32 m-2 bg-black/40 rounded-lg overflow-hidden relative">
                <svg viewBox="0 0 100 100" class="w-full h-full opacity-70">
                    <path d="M50 50 C 10 10, 90 10, 50 90 C 10 50, 90 50, 50 10" 
                          fill="none" stroke="var(--nld-pink)" stroke-width="0.8" class="lorenz-path" />
                </svg>
            </div>
            <div class="px-3 font-mono text-[9px] space-y-1">
                <div class="flex justify-between"><span>Lyapunov:</span><span class="text-white">λ ≈ 0.905</span></div>
                <div class="flex justify-between"><span>Bifurcation:</span><span class="text-white">Stable</span></div>
            </div>
        </div>

        <div class="glass-panel w-60 h-72 right-10 top-[20%] z-50 transform rotate-3" data-depth="0.2">
            <div class="p-3 border-b border-emerald-500/20">
                <span class="text-[10px] font-bold text-emerald-400 tracking-tighter uppercase">Comp. Biophysics</span>
            </div>
            <div class="h-40 flex justify-center items-center">
                <svg width="40" height="120" viewBox="0 0 40 120" class="dna-strand">
                    <path d="M10,0 Q30,30 10,60 Q-10,90 10,120" fill="none" stroke="var(--bio-green)" stroke-width="2" />
                    <path d="M30,0 Q10,30 30,60 Q50,90 30,120" fill="none" stroke="var(--ml-cyan)" stroke-width="2" />
                </svg>
            </div>
            <div class="px-3 font-mono text-[9px] bg-black/20 py-2 rounded-b-lg">
                <div class="text-emerald-300">Docking: ΔG -9.2 kcal</div>
            </div>
        </div>

    </div>

    <script>
        const scene = document.getElementById('scene');
        const layers = document.querySelectorAll('[data-depth]');

        window.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const mouseX = e.clientX - centerX;
            const mouseY = e.clientY - centerY;

            scene.style.transform = `rotateX(${-mouseY / 150}deg) rotateY(${mouseX / 150}deg)`;

            layers.forEach(layer => {
                const depth = parseFloat(layer.getAttribute('data-depth'));
                const moveX = mouseX * depth;
                const moveY = mouseY * depth;
                
                const currentTransform = layer.style.transform;
                const rotateMatch = currentTransform.match(/rotate\((.*?)\)/) || currentTransform.match(/rotate[XZ]\((.*?)\)/);
                const rotation = rotateMatch ? rotateMatch[0] : '';
                
                layer.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) ${rotation}`;
            });
        });

        window.addEventListener('resize', () => {
            const scale = Math.min(window.innerWidth / 1200, 1);
            scene.style.transform = `scale(${scale})`;
        });
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>